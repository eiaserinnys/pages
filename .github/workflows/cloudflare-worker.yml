name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-worker.yml"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "src/dashboard.js"
      - "src/dashboardClient.js"
      - "src/dashboardData.js"
      - "src/dashboardStyles.js"
      - "src/node/**"
      - "src/docState.mjs"
      - "src/worker.mjs"
      - "src/oauthProvider.mjs"
      - "src/signedTokens.mjs"
      - "src/vtuberLive.mjs"
      - "src/reviewClient.mjs"
      - "src/workerDashboard.mjs"
      - "wrangler.toml"
      - "scripts/render_wrangler_config.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-worker.yml"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "src/dashboard.js"
      - "src/dashboardClient.js"
      - "src/dashboardData.js"
      - "src/dashboardStyles.js"
      - "src/node/**"
      - "src/docState.mjs"
      - "src/worker.mjs"
      - "src/oauthProvider.mjs"
      - "src/signedTokens.mjs"
      - "src/vtuberLive.mjs"
      - "src/reviewClient.mjs"
      - "src/workerDashboard.mjs"
      - "wrangler.toml"
      - "scripts/render_wrangler_config.mjs"
      - "client/**"
      - "scripts/build-encrypted-page.mjs"
      - "scripts/review-browser.mjs"
      - "test/**"
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: "Apply D1 migrations before deploying"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Render wrangler.deploy.toml
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          PAGES_D1_DATABASE_ID: ${{ vars.PAGES_D1_DATABASE_ID }}
          PAGES_ROUTE_PATTERN: ${{ vars.PAGES_ROUTE_PATTERN }}
          PAGES_ZONE_NAME: ${{ vars.PAGES_ZONE_NAME }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ] && { [ -z "$PAGES_BASE_URL" ] || [ -z "$PAGES_D1_DATABASE_ID" ]; }; then
            echo "Repository variables are not available to this pull request; rendering example values for the dry-run."
            export PAGES_BASE_URL=https://pages.example.com
            export PAGES_D1_DATABASE_ID=00000000-0000-4000-8000-000000000000
            export PAGES_ROUTE_PATTERN=pages.example.com
            export PAGES_ZONE_NAME=example.com
          fi
          node scripts/render_wrangler_config.mjs

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npm run worker:check

      - name: Stop automatic deploy when migrations changed
        if: github.event_name == 'push'
        run: |
          set -eu
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^migrations/'; then
            echo "D1 migration files changed. Run this workflow manually with apply_d1_migrations=true."
            exit 1
          fi

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' && inputs.apply_d1_migrations
        run: npm run worker:migrate:d1 -- --config wrangler.deploy.toml

      - run: npm run worker:dry-run -- --config wrangler.deploy.toml --outdir /tmp/pages-review-worker

      - run: REVIEW_WORKER_MODULE=file:///tmp/pages-review-worker/worker.js npm run test:review-browser

      - name: Deploy with ALLOWED_EMAILS as a Worker secret
        if: github.event_name != 'pull_request'
        env:
          PAGES_ALLOWED_EMAILS: ${{ secrets.PAGES_ALLOWED_EMAILS }}
        run: |
          set -eu
          umask 077
          secrets_file="$RUNNER_TEMP/pages-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
          const value = (process.env.PAGES_ALLOWED_EMAILS || "").trim();
          const addresses = value.split(",").map((s) => s.trim()).filter(Boolean);
          if (!addresses.length) { console.error("Missing repository secret: PAGES_ALLOWED_EMAILS"); process.exit(1); }
          for (const address of addresses) console.log("::add-mask::" + address);
          require("fs").writeFileSync(process.argv[1], JSON.stringify({ ALLOWED_EMAILS: value }), { mode: 0o600 });
          ' "$secrets_file"
          npx --yes wrangler@4.86.0 deploy --config wrangler.deploy.toml --secrets-file "$secrets_file"
